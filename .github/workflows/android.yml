# Builds the Android app (GamesLane.Mobile/android) for the production site: an app bundle (.aab) to upload to Google
# Play, kept as the run's artifact. Signed with the upload key when the repository has its secrets (see
# docs/developer-guide.md, Android app); otherwise unsigned, which still checks that the app builds.
name: Android app

on:
  push:
    branches: [main]
    paths: ["GamesLane.Mobile/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["GamesLane.Mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GamesLane.Mobile
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: GamesLane.Mobile/package-lock.json

      - name: Install and copy the app's settings into the Android project
        run: |
          npm ci
          npx cap sync android

      - name: Firebase settings (turn notifications)
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Upload key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "GAMESLANE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the app bundle
        working-directory: GamesLane.Mobile/android
        env:
          GAMESLANE_VERSION_CODE: ${{ github.run_number }}
          GAMESLANE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          GAMESLANE_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          GAMESLANE_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease lintRelease --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: gameslane-android-${{ github.run_number }}
          path: GamesLane.Mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/app/google-services.json
