<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tic-tac-toe - GamesLane</title>
    <link rel="icon" href="images/logo-32.png">
    <link rel="apple-touch-icon" href="images/logo-180.png">
    <meta name="theme-color" content="#19285d">
    <link rel="stylesheet" href="styles.css">
    <!-- SignalR sets a global "t" while it loads, so it comes before i18n.js, which defines t(). -->
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
    <script src="i18n.js"></script>
</head>
<body>
<div class="masthead">
    <header class="top">
        <a href="/?splash" class="brand" data-leave title="Main screen"><img class="brand-name" src="images/name.png" alt="GamesLane"></a>
        <div id="account" class="account"></div>
    </header>
    <div class="session-bar">
        <img class="session-art" src="images/games/tictactoe.svg" alt="">
        <h2 class="session-name">Tic-tac-toe</h2>
        <span id="session-info" class="session-info"></span>
        <p class="code" title="Game code"><span aria-hidden="true">🔑</span> <strong id="session-code"></strong></p>
    </div>
    <div id="status-bar" class="status-bar" hidden>
        <p id="status" class="status"></p>
        <span class="status-actions">
            <button id="next-round" type="button" class="small" hidden>Next round</button>
            <button id="play-again" type="button" class="small" hidden>Play again</button>
            <button id="to-lobby" type="button" class="secondary small" hidden>Back to the lobby</button>
        </span>
        <ul id="scores" class="score-row"></ul>
    </div>
</div>
<main>
    <section id="session">
        <div id="invite" class="invite" hidden>
            <h3>Invite friends</h3>
            <p class="hint">Send them this link, or tell them the game code.</p>
            <a id="join-url" class="join-url"></a>
            <div class="actions center">
                <button id="copy-link" type="button" class="secondary" hidden>Copy link</button>
                <button id="share-link" type="button" class="secondary" hidden>Share…</button>
            </div>
        </div>

        <div id="session-lobby" class="panel lobby" hidden>
            <div class="lobby-head">
                <h3>Players</h3>
                <span id="seat-count" class="seat-count"></span>
            </div>
            <button id="lobby-options" type="button" class="lobby-options" hidden><span id="options-summary"></span></button>
            <p id="lobby-status" class="status"></p>
            <ul id="seats" class="seats"></ul>
            <p id="login-to-play" class="hint" hidden>Log in to take a seat. <button type="button" class="secondary small" data-login>Log in</button></p>
            <div class="actions center">
                <button id="start-game" type="button" class="big" hidden>Start</button>
            </div>
        </div>

        <div id="game-screen" hidden>
            <div id="board" class="board"></div>
        </div>
    </section>

    <p id="error" class="error" role="alert"></p>
</main>
<script src="common.js"></script>
<script src="tictactoe.js"></script>
</body>
</html>
