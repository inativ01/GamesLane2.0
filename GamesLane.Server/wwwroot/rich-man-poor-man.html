<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rich man, poor man - GamesLane</title>
    <link rel="icon" href="images/logo-32.png">
    <link rel="apple-touch-icon" href="images/logo-180.png">
    <meta name="theme-color" content="#19285d">
    <link rel="stylesheet" href="styles.css">
    <!-- SignalR sets a global "t" while it loads, so it comes before i18n.js, which defines t(). -->
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
    <script src="lang/he.js"></script>
    <script src="i18n.js"></script>
</head>
<body>
<header class="top">
    <a href="/" class="brand" data-leave><img class="brand-name" src="images/name.png" alt="GamesLane"></a>
    <a href="/?splash" class="home-link" data-leave title="Main screen" aria-label="Main screen" data-i18n-attr="title,aria-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5v10h5V14h3v5.5h5v-10"/></svg></a>
    <div id="account" class="account"></div>
</header>
<main class="rich-poor">
    <section id="session">
        <div class="session-head">
            <img class="session-art" src="images/games/rich-man-poor-man.svg" alt="">
            <div class="session-title">
                <h2 data-i18n>Rich man, poor man</h2>
                <p data-i18n>6–12 players</p>
            </div>
            <p class="code"><span data-i18n>Game code</span> <strong id="session-code"></strong></p>
        </div>
        <div id="invite" class="invite" hidden>
            <h3 data-i18n>Invite friends</h3>
            <p class="hint" data-i18n>Send them this link, or tell them the game code.</p>
            <a id="join-url" class="join-url"></a>
            <div class="actions center">
                <button id="copy-link" type="button" class="secondary" hidden data-i18n>Copy link</button>
                <button id="share-link" type="button" class="secondary" hidden data-i18n>Share…</button>
            </div>
        </div>

        <div id="session-lobby" class="panel lobby" hidden>
            <div class="lobby-head">
                <h3 data-i18n>Players</h3>
                <span id="seat-count" class="seat-count"></span>
            </div>
            <div id="lobby-options" class="lobby-options" hidden>
                <span id="options-summary"></span>
                <button id="edit-options" type="button" class="secondary small" data-i18n>Game options</button>
            </div>
            <p id="lobby-status" class="status"></p>
            <ul id="seats" class="seats"></ul>
            <p id="login-to-play" class="hint" hidden><span data-i18n>Log in to take a seat.</span> <button type="button" class="secondary small" data-login data-i18n>Log in</button></p>
            <div class="actions center">
                <button id="start-game" type="button" class="big" hidden data-i18n>Start</button>
            </div>
        </div>

        <div id="game-screen" hidden>
            <p id="status" class="status"></p>

            <!-- This user's own cards and buttons, one panel per seat they hold. -->
            <div id="rp-hands"></div>

            <!-- During the exchange: users asking to join, and players accepting them at a place. -->
            <div id="rp-join" class="panel rp-join" hidden></div>

            <!-- Everything observers see: the cards on the table and the players in place order. -->
            <section class="rp-table" aria-label="Table" data-i18n-attr="aria-label">
                <div class="rp-table-head">
                    <span id="rp-game" class="rp-game"></span>
                    <button id="rp-speech" type="button" class="secondary small" hidden></button>
                </div>
                <div id="rp-pile" class="rp-pile"></div>
                <ol id="rp-players" class="rp-players"></ol>
            </section>

            <div class="actions center">
                <button id="next-round" type="button" hidden data-i18n>Next game</button>
            </div>
            <div id="game-over-actions" class="actions center" hidden>
                <button id="play-again" type="button" data-i18n>Play again</button>
                <button id="to-lobby" type="button" class="secondary" data-i18n>Back to the lobby</button>
            </div>
            <button id="stand-up" type="button" class="secondary small" hidden data-i18n>Stand up</button>
        </div>
    </section>

    <p id="error" class="error" role="alert"></p>
</main>
<script src="common.js"></script>
<script src="rich-man-poor-man.js"></script>
</body>
</html>
