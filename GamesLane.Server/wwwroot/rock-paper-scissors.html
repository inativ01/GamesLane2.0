<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rock-paper-scissors - GamesLane</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <header class="top">
        <a href="/" class="brand" data-leave>GamesLane</a>
        <div id="account" class="account"></div>
    </header>
    <nav class="back"><a href="/" data-leave>← Back to main screen</a></nav>

    <section id="session">
        <h2>Rock-paper-scissors</h2>
        <p class="code">Session code: <strong id="session-code"></strong></p>
        <div id="invite" class="invite" hidden>
            <p class="hint">Invite players with this link:</p>
            <a id="join-url" class="join-url"></a>
            <div class="actions center">
                <button id="copy-link" type="button" class="secondary" hidden>Copy link</button>
                <button id="share-link" type="button" class="secondary" hidden>Share…</button>
            </div>
        </div>

        <div id="session-lobby" class="panel" hidden>
            <p id="lobby-status" class="status"></p>
            <ul id="seats" class="seats"></ul>
            <p id="login-to-play" class="hint" hidden>Log in to take a seat. <button type="button" class="secondary small" data-login>Log in</button></p>
            <div class="actions center">
                <button id="resume-game" type="button" hidden>Resume game</button>
                <button id="start-game" type="button" hidden>Start</button>
            </div>
        </div>

        <div id="game-screen" hidden>
            <p id="status" class="status"></p>
            <div id="hands" class="hands"></div>
            <p id="pick-for" class="hint" hidden></p>
            <div id="picks" class="actions center" hidden>
                <button type="button" class="pick" data-choice="Rock">✊ Rock</button>
                <button type="button" class="pick" data-choice="Paper">✋ Paper</button>
                <button type="button" class="pick" data-choice="Scissors">✌️ Scissors</button>
            </div>
            <button id="next-round" type="button" hidden>Next round</button>
            <div id="game-over-actions" class="actions center" hidden>
                <button id="play-again" type="button">Play again</button>
                <button id="to-lobby" type="button" class="secondary">Back to session lobby</button>
            </div>
            <ul id="players" class="players"></ul>
            <button id="stand-up" type="button" class="secondary small" hidden>Stand up</button>
        </div>
    </section>

    <p id="error" class="error" role="alert"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
<script src="common.js"></script>
<script src="rock-paper-scissors.js"></script>
</body>
</html>
