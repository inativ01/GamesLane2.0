<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Yaniv">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6b45"/>
      <stop offset="1" stop-color="#173f27"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#felt)"/>
  <!-- A low hand: a fan of an ace, a two and a joker, under a speech bubble with "7". -->
  <path d="M60 10 h22 a10 10 0 0 1 10 10 v8 a10 10 0 0 1 -10 10 h-10 l-8 8 v-8 h-4 a10 10 0 0 1 -10 -10 v-8 a10 10 0 0 1 10 -10 Z" fill="#f6cf6b" stroke="#8a5a10" stroke-width="1.5"/>
  <text x="71" y="31" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1d1a17" text-anchor="middle">≤7</text>
  <g font-family="Georgia, serif" font-weight="700">
    <g transform="rotate(-18 50 108)">
      <rect x="26" y="50" width="32" height="46" rx="4" fill="#fff" stroke="#c9c2b6"/>
      <text x="30" y="64" font-size="12" fill="#1d1a17">A</text>
      <text x="42" y="86" font-size="18" fill="#1d1a17" text-anchor="middle">♠</text>
    </g>
    <g>
      <rect x="40" y="52" width="32" height="46" rx="4" fill="#fff" stroke="#c9c2b6"/>
      <text x="44" y="66" font-size="12" fill="#c0281b">2</text>
      <text x="56" y="88" font-size="18" fill="#c0281b" text-anchor="middle">♥</text>
    </g>
    <g transform="rotate(18 70 108)">
      <rect x="54" y="50" width="32" height="46" rx="4" fill="#fff" stroke="#c9c2b6"/>
      <text x="70" y="80" font-size="22" text-anchor="middle">🃏</text>
    </g>
  </g>
</svg>
