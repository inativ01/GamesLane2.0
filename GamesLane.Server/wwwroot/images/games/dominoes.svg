<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Dominoes">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6b45"/>
      <stop offset="1" stop-color="#173f27"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#felt)"/>
  <!-- Two tiles: a 6-6 standing, and a 3-5 lying across it. -->
  <g transform="rotate(-14 46 60)">
    <rect x="30" y="18" width="32" height="64" rx="6" fill="#fffdf5" stroke="#3b3127" stroke-width="2"/>
    <line x1="34" y1="50" x2="58" y2="50" stroke="#3b3127" stroke-width="2"/>
    <g fill="#1d1a17">
      <circle cx="38" cy="26" r="3"/><circle cx="54" cy="26" r="3"/><circle cx="38" cy="34" r="3"/>
      <circle cx="54" cy="34" r="3"/><circle cx="38" cy="42" r="3"/><circle cx="54" cy="42" r="3"/>
      <circle cx="38" cy="58" r="3"/><circle cx="54" cy="58" r="3"/><circle cx="38" cy="66" r="3"/>
      <circle cx="54" cy="66" r="3"/><circle cx="38" cy="74" r="3"/><circle cx="54" cy="74" r="3"/>
    </g>
  </g>
  <g transform="rotate(8 76 86)">
    <rect x="44" y="70" width="64" height="32" rx="6" fill="#fffdf5" stroke="#3b3127" stroke-width="2"/>
    <line x1="76" y1="74" x2="76" y2="98" stroke="#3b3127" stroke-width="2"/>
    <g fill="#1d1a17">
      <circle cx="52" cy="78" r="3"/><circle cx="60" cy="86" r="3"/><circle cx="68" cy="94" r="3"/>
      <circle cx="84" cy="78" r="3"/><circle cx="100" cy="78" r="3"/><circle cx="92" cy="86" r="3"/>
      <circle cx="84" cy="94" r="3"/><circle cx="100" cy="94" r="3"/>
    </g>
