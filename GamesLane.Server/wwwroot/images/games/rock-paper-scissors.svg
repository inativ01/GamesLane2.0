<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Rock-paper-scissors">
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#4a2a17"/>
      <stop offset="1" stop-color="#140d09"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9b1a6"/>
      <stop offset="1" stop-color="#6f675d"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- Circle of arrows: each beats the next -->
  <circle cx="60" cy="62" r="36" fill="none" stroke="#e6a93c" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.55"/>
  <!-- Paper (top) -->
  <g transform="rotate(8 60 34)">
    <rect x="45" y="14" width="30" height="38" rx="3" fill="#fbfaf7" stroke="#d8d2c8" stroke-width="1.5"/>
    <path d="M67 14 L75 22 L67 22 Z" fill="#e3dccf"/>
    <line x1="50" y1="28" x2="70" y2="28" stroke="#c9c1b4" stroke-width="2"/>
    <line x1="50" y1="35" x2="70" y2="35" stroke="#c9c1b4" stroke-width="2"/>
    <line x1="50" y1="42" x2="64" y2="42" stroke="#c9c1b4" stroke-width="2"/>
  </g>
  <!-- Rock (bottom left) -->
  <path d="M16 90 L22 72 L36 64 L50 68 L56 82 L50 98 L30 102 Z" fill="url(#stone)" stroke="#4f4840" stroke-width="2" stroke-linejoin="round"/>
  <path d="M26 78 L36 72 M38 86 L46 80" stroke="#8c847a" stroke-width="2" stroke-linecap="round"/>
  <!-- Scissors (bottom right) -->
  <g stroke-linecap="round">
    <line x1="82" y1="94" x2="98" y2="58" stroke="#e3e0da" stroke-width="5"/>
    <line x1="100" y1="94" x2="82" y2="58" stroke="#c9c5bd" stroke-width="5"/>
    <circle cx="79" cy="99" r="7" fill="none" stroke="#e8731c" stroke-width="4.5"/>
    <circle cx="103" cy="99" r="7" fill="none" stroke="#e8731c" stroke-width="4.5"/>
    <circle cx="90.5" cy="76" r="2.6" fill="#4f4840"/>
  </g>
</svg>
