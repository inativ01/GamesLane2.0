<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jack">
  <!-- A playing card with a big J and no suit -->
  <g transform="rotate(-8 32 32)">
    <rect x="14" y="5" width="36" height="54" rx="5" fill="#fff" stroke="#2b2420" stroke-width="2.5"/>
    <rect x="19" y="14" width="26" height="36" rx="3" fill="none" stroke="#e0a526" stroke-width="1.5"/>
    <text x="19.5" y="13" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#2b2420">J</text>
    <text x="32" y="42" font-family="Georgia, serif" font-size="28" font-weight="700" text-anchor="middle" fill="#2b2420">J</text>
    <text x="44.5" y="51" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#2b2420" transform="rotate(180 44.5 53)">J</text>
  </g>
</svg>
