<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Gang - GamesLane</title>
    <link rel="icon" href="images/logo-32.png">
    <link rel="apple-touch-icon" href="images/logo-180.png">
    <meta name="theme-color" content="#0d0c0b">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
    <a href="/" class="brand" data-leave><img class="brand-logo" src="images/logo-180.png" alt=""><span class="brand-name">Games<span>Lane</span></span></a>
    <a href="/" class="home-link" data-leave title="Main screen" aria-label="Main screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5v10h5V14h3v5.5h5v-10"/></svg></a>
    <div id="account" class="account"></div>
</header>
<main class="gang">
    <section id="session">
        <div class="session-head">
            <img class="session-art" src="images/games/the-gang.svg" alt="">
            <div class="session-title">
                <h2>The Gang</h2>
                <p>3–6 players</p>
            </div>
            <p class="code"><span>Game code</span> <strong id="session-code"></strong></p>
        </div>
        <div id="invite" class="invite" hidden>
            <h3>Invite friends</h3>
            <p class="hint">Send them this link, or tell them the game code.</p>
            <a id="join-url" class="join-url"></a>
            <div class="actions center">
                <button id="copy-link" type="button" class="secondary" hidden>Copy link</button>
                <button id="share-link" type="button" class="secondary" hidden>Share…</button>
            </div>
        </div>

        <div id="session-lobby" class="panel lobby" hidden>
            <div class="lobby-head">
                <h3>Players</h3>
                <span id="seat-count" class="seat-count"></span>
            </div>
            <div id="lobby-options" class="lobby-options" hidden>
                <span id="options-summary"></span>
                <button id="edit-options" type="button" class="secondary small">Game options</button>
            </div>
            <p id="lobby-status" class="status"></p>
            <ul id="seats" class="seats"></ul>
            <p id="login-to-play" class="hint" hidden>Log in to take a seat. <button type="button" class="secondary small" data-login>Log in</button></p>
            <div class="actions center">
                <button id="take-seat" type="button" class="big secondary" hidden>Take a seat</button>
                <button id="resume-game" type="button" class="big" hidden>Resume game</button>
                <button id="start-game" type="button" class="big" hidden>Start</button>
            </div>
        </div>

        <div id="game-screen" hidden>
            <p id="status" class="status"></p>

            <!-- This user's own cards and controls, and the group decisions of the heist's cards. -->
            <div id="my-hands"></div>
            <div id="my-decisions" class="my-decisions" hidden></div>
            <div class="actions center gang-controls">
                <button id="reveal-next" type="button" hidden>Reveal next hand</button>
                <button id="next-heist" type="button" hidden>Next heist</button>
            </div>
            <div id="game-over-actions" class="actions center" hidden>
                <button id="play-again" type="button">Play again</button>
                <button id="to-lobby" type="button" class="secondary">Back to the lobby</button>
            </div>

            <!-- Everything observers see. Players can hide it, e.g. when a TV shows it. -->
            <section class="table-view" aria-label="Table">
                <div class="table-head">
                    <div class="gang-score">
                        <span>Heist <strong id="heist"></strong></span>
                        <span>💰 <strong id="vaults"></strong></span>
                        <span>🚨 <strong id="alarms"></strong></span>
                    </div>
                    <button id="toggle-table" type="button" class="secondary small" hidden>Hide table</button>
                </div>
                <div id="table-body" class="table-body">
                    <div id="community" class="card-row"></div>
                    <div id="middle"></div>
                    <table id="chip-table" class="chip-table"></table>
                    <ol id="revealed" class="revealed"></ol>
                    <!-- The heist's challenge or specialist cards, and what they showed everyone. -->
                    <ul id="heist-cards" class="heist-cards" hidden></ul>
                </div>
            </section>

            <button id="stand-up" type="button" class="secondary small" hidden>Stand up</button>
        </div>
    </section>

    <p id="error" class="error" role="alert"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
<script src="common.js"></script>
<script src="the-gang.js"></script>
</body>
</html>
