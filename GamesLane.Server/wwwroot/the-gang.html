<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Gang - GamesLane</title>
    <link rel="icon" href="images/logo-32.png">
    <link rel="apple-touch-icon" href="images/logo-180.png">
    <meta name="theme-color" content="#19285d">
    <link rel="stylesheet" href="styles.css">
    <!-- SignalR sets a global "t" while it loads, so it comes before i18n.js, which defines t(). -->
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
    <script src="lang/he.js"></script>
    <script src="lang/es.js"></script>
    <script src="lang/fr.js"></script>
    <script src="lang/pt.js"></script>
    <script src="i18n.js"></script>
</head>
<body>
<div class="masthead">
    <header class="top">
        <a href="/?splash" class="brand" data-leave title="Main screen" data-i18n-attr="title"><img class="brand-name" src="images/name.png" alt="GamesLane"></a>
        <div id="account" class="account"></div>
    </header>
    <div class="session-bar">
        <img class="session-art" src="images/games/the-gang.svg" alt="">
        <h2 class="session-name" data-i18n>The Gang</h2>
        <span id="session-info" class="session-info"></span>
        <p class="code" title="Game code" data-i18n-attr="title"><span aria-hidden="true">🔑</span> <strong id="session-code"></strong></p>
    </div>
    <div id="status-bar" class="status-bar" hidden>
        <p id="status" class="status"></p>
        <span class="status-actions">
            <button id="next-heist" type="button" class="small" hidden data-i18n>Next heist</button>
            <button id="play-again" type="button" class="small" hidden data-i18n>Play again</button>
            <button id="to-lobby" type="button" class="secondary small" hidden data-i18n>Back to the lobby</button>
        </span>
    </div>
</div>
<main class="gang">
    <section id="session">
        <div id="invite" class="invite" hidden>
            <h3 data-i18n>Invite friends</h3>
            <p class="hint" data-i18n>Send them this link, or tell them the game code.</p>
            <a id="join-url" class="join-url"></a>
            <div class="actions center">
                <button id="copy-link" type="button" class="secondary" hidden data-i18n>Copy link</button>
                <button id="share-link" type="button" class="secondary" hidden data-i18n>Share…</button>
            </div>
        </div>

        <div id="session-lobby" class="panel lobby" hidden>
            <div class="lobby-head">
                <h3 data-i18n>Players</h3>
                <span id="seat-count" class="seat-count"></span>
            </div>
            <button id="lobby-options" type="button" class="lobby-options" hidden><span id="options-summary"></span></button>
            <p id="lobby-status" class="status"></p>
            <ul id="seats" class="seats"></ul>
            <div class="actions center">
                <button id="start-game" type="button" class="big" hidden data-i18n>Start</button>
            </div>
        </div>

        <div id="game-screen" hidden>
            <!-- The top of the table, always shown to players above their hands: the shared cards. Observers get them in
                 the table below (see the page's script). -->
            <div id="table-top" class="table-top">
                <div id="community" class="card-row"></div>
            </div>

            <!-- This user's own cards and controls, and the group decisions of the heist's cards. -->
            <div id="my-hands"></div>
            <div id="my-decisions" class="my-decisions" hidden></div>
            <div class="actions center gang-controls">
                <button id="reveal-next" type="button" hidden data-i18n>Reveal next hand</button>
            </div>

            <!-- Everything observers see. Players can hide it, e.g. when a TV shows it. -->
            <section class="table-view" aria-label="Table" data-i18n-attr="aria-label">
                <div class="table-head">
                    <div class="gang-score">
                        <span><span data-i18n>Heist</span> <strong id="heist"></strong></span>
                        <span>💰 <strong id="vaults"></strong></span>
                        <span>🚨 <strong id="alarms"></strong></span>
                    </div>
                    <button id="toggle-table" type="button" class="secondary small" hidden>Hide table</button>
                </div>
                <div id="table-body" class="table-body">
                    <div id="middle"></div>
                    <!-- The heist's challenge or specialist cards. -->
                    <ul id="heist-cards" class="heist-cards" hidden></ul>
                    <table id="chip-table" class="chip-table"></table>
                    <ol id="revealed" class="revealed"></ol>
                    <!-- The game's options, one per line (filled by common.js). -->
                    <div id="game-options" class="game-options" hidden></div>
                </div>
            </section>
        </div>
    </section>

    <p id="error" class="error" role="alert"></p>
</main>
<script src="common.js"></script>
<script src="the-gang.js"></script>
</body>
</html>
