<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GamesLane</title>
    <link rel="icon" href="images/logo-32.png">
    <link rel="apple-touch-icon" href="images/logo-180.png">
    <meta name="theme-color" content="#19285d">
    <link rel="stylesheet" href="styles.css">
    <script>
        // The splash screen shows for 5 seconds when the app is first opened in this tab, and when the GamesLane name is
        // used (/?splash). It runs on its own, so it ends even if the page's other scripts are slow or fail to load. The
        // ?splash is removed from the address, so reloading the page does not show it again.
        if (!sessionStorage.getItem("splashShown") || new URLSearchParams(location.search).has("splash")) {
            const root = document.documentElement;
            root.classList.add("splashing");
            sessionStorage.setItem("splashShown", "1");
            const url = new URL(location.href);
            if (url.searchParams.has("splash")) {
                url.searchParams.delete("splash");
                history.replaceState(null, "", url.pathname + url.search);
            }
            setTimeout(() => root.classList.add("splash-done"), 5000);
            setTimeout(() => root.classList.remove("splashing", "splash-done"), 5500);
        }
    </script>
    <!-- SignalR sets a global "t" while it loads, so it comes before i18n.js, which defines t(). -->
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
    <script src="lang/he.js"></script>
    <script src="i18n.js"></script>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true">
    <picture>
        <source media="(orientation: portrait)" srcset="images/splash-portrait-small.jpg 512w, images/splash-portrait.jpg 1024w" sizes="100vw">
        <img src="images/splash-landscape.jpg" srcset="images/splash-landscape-small.jpg 768w, images/splash-landscape.jpg 1536w" sizes="100vw" alt="">
    </picture>
</div>
<header class="top">
    <a href="/?splash" class="brand" title="Main screen" data-i18n-attr="title"><img class="brand-name" src="images/name.png" alt="GamesLane"></a>
    <div id="account" class="account"></div>
</header>
<main>
    <section id="home">
        <div class="panel">
            <h2 data-i18n>Start a new game</h2>
            <p id="arrange-hint" class="hint arrange-hint" hidden data-i18n>Drag a game by its ⋮⋮ handle to change the order.</p>
            <div id="game-list" class="game-list">
                <button type="button" class="game-tile" data-create="TheGang">
                    <img src="images/games/the-gang.svg" alt="">
                    <span class="game-text">
                        <span class="game-title" data-i18n>The Gang</span>
                        <span class="game-desc" data-i18n>A team poker heist. Rank your hands in secret.</span>
                        <span class="game-players" data-i18n>3–8 players</span>
                    </span>
                    <span class="game-go" aria-hidden="true">›</span>
                </button>
                <button type="button" class="game-tile" data-create="Backgammon">
                    <img src="images/games/backgammon.svg" alt="">
                    <span class="game-text">
                        <span class="game-title" data-i18n>Backgammon</span>
                        <span class="game-desc" data-i18n>Race your checkers home. Matches with the doubling cube.</span>
                        <span class="game-players" data-i18n>2 players</span>
                    </span>
                    <span class="game-go" aria-hidden="true">›</span>
                </button>
                <button type="button" class="game-tile" data-create="RichManPoorMan">
                    <img src="images/games/rich-man-poor-man.svg" alt="">
                    <span class="game-text">
                        <span class="game-title" data-i18n>Rich man, poor man</span>
                        <span class="game-desc" data-i18n>Get rid of your cards first and become the rich man.</span>
                        <span class="game-players" data-i18n>6–12 players</span>
                    </span>
                    <span class="game-go" aria-hidden="true">›</span>
                </button>
                <button type="button" class="game-tile" data-create="Yatzee">
                    <img src="images/games/yatzee.svg" alt="">
                    <span class="game-text">
                        <span class="game-title" data-i18n>Yatzee</span>
                        <span class="game-desc" data-i18n>Roll five dice, three times a turn, and fill your scorecard.</span>
                        <span class="game-players" data-i18n>1–8 players</span>
                    </span>
                    <span class="game-go" aria-hidden="true">›</span>
                </button>
                <button type="button" class="game-tile" data-create="RockPaperScissors">
                    <img src="images/games/rock-paper-scissors.svg" alt="">
                    <span class="game-text">
                        <span class="game-title" data-i18n>Rock-paper-scissors</span>
                        <span class="game-desc" data-i18n>Pick in secret, keep score round after round.</span>
                        <span class="game-players" data-i18n>2 players</span>
                    </span>
                    <span class="game-go" aria-hidden="true">›</span>
                </button>
                <button type="button" class="game-tile" data-create="TicTacToe">
                    <img src="images/games/tictactoe.svg" alt="">
                    <span class="game-text">
                        <span class="game-title" data-i18n>Tic-tac-toe</span>
                        <span class="game-desc" data-i18n>The classic. Be first to get three in a row.</span>
                        <span class="game-players" data-i18n>2 players</span>
                    </span>
                    <span class="game-go" aria-hidden="true">›</span>
                </button>
            </div>
        </div>

        <div class="panel">
            <h2 data-i18n>Join a game</h2>
            <p class="hint" data-i18n>Got a code from a friend? Enter it to join the game.</p>
            <form id="join-form">
                <div class="join-row">
                    <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="CODE" aria-label="Game code" data-i18n-attr="placeholder,aria-label">
                    <button type="submit" data-i18n>Join</button>
                </div>
            </form>
        </div>
    </section>

    <p id="error" class="error" role="alert"></p>
    <footer class="hint"><a href="/privacy.html" data-i18n>Privacy policy</a></footer>
</main>
<script src="common.js"></script>
<script src="home.js"></script>
</body>
</html>
