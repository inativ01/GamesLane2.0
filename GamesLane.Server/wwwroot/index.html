<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GamesLane</title>
    <link rel="icon" href="images/logo-32.png">
    <link rel="apple-touch-icon" href="images/logo-180.png">
    <meta name="theme-color" content="#0d0c0b">
    <link rel="stylesheet" href="styles.css">
    <script>
        // The splash screen shows when the app is first opened in this tab, and when the home icon is used (/?splash).
        if (!sessionStorage.getItem("splashShown") || new URLSearchParams(location.search).has("splash")) {
            document.documentElement.classList.add("splashing");
        }
    </script>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true">
    <picture>
        <source media="(orientation: portrait)" srcset="images/splash-portrait-small.jpg 512w, images/splash-portrait.jpg 1024w" sizes="100vw">
        <img src="images/splash-landscape.jpg" srcset="images/splash-landscape-small.jpg 768w, images/splash-landscape.jpg 1536w" sizes="100vw" alt="">
    </picture>
</div>
<header class="top">
    <a href="/" class="brand"><img class="brand-name" src="images/name.png" alt="GamesLane"></a>
    <div id="account" class="account"></div>
</header>
<main>
    <section id="home">
        <div class="panel">
            <h2>Start a new game</h2>
            <div class="game-list">
                <button type="button" class="game-tile" data-create="TheGang">
                    <img src="images/games/the-gang.svg" alt="">
                    <span class="game-text">
                        <span class="game-title">The Gang</span>
                        <span class="game-desc">A team poker heist. Rank your hands in secret.</span>
                        <span class="game-players">3–8 players</span>
                    </span>
                    <span class="game-go" aria-hidden="true">›</span>
                </button>
                <button type="button" class="game-tile" data-create="RockPaperScissors">
                    <img src="images/games/rock-paper-scissors.svg" alt="">
                    <span class="game-text">
                        <span class="game-title">Rock-paper-scissors</span>
                        <span class="game-desc">Pick in secret, keep score round after round.</span>
                        <span class="game-players">2 players</span>
                    </span>
                    <span class="game-go" aria-hidden="true">›</span>
                </button>
                <button type="button" class="game-tile" data-create="TicTacToe">
                    <img src="images/games/tictactoe.svg" alt="">
                    <span class="game-text">
                        <span class="game-title">Tic-tac-toe</span>
                        <span class="game-desc">The classic. Be first to get three in a row.</span>
                        <span class="game-players">2 players</span>
                    </span>
                    <span class="game-go" aria-hidden="true">›</span>
                </button>
            </div>
        </div>

        <div class="panel">
            <h2>Join a game</h2>
            <p class="hint">Got a code from a friend? Anyone can join to watch; log in to take a seat.</p>
            <form id="join-form">
                <div class="join-row">
                    <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="CODE" aria-label="Game code">
                    <button type="submit">Join</button>
                </div>
            </form>
        </div>
    </section>

    <p id="error" class="error" role="alert"></p>
    <footer class="hint"><a href="/privacy.html">Privacy policy</a></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
<script src="common.js"></script>
<script src="home.js"></script>
</body>
</html>
